[theme]
base = "light"

primaryColor = "#4F46E5"
backgroundColor = "#F5F7FB"
secondaryBackgroundColor = "#FFFFFF"

textColor = "#111827"

font = "sans serif"

[server]
headless = true
runOnSave = true
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true

[runner]
fastReruns = true